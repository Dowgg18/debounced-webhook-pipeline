[project]
name = "burstq"
version = "0.1.0"
description = "A Redis Streams pipeline that turns a burst of chat webhooks into exactly one ordered unit of work per conversation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["redis", "redis-streams", "webhook", "debounce", "idempotency", "chat", "queue"]
dependencies = [
    "redis>=5.0",
]

[project.optional-dependencies]
demo = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
metrics = ["prometheus-client>=0.20"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "fakeredis[lua]>=2.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/burstq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
